title: Zero-Trust Sandbox Escape and Cloud Metadata Probe
id: 6d6c3a4b-4e82-4a2b-9f1a-0d5f9c3e1001
status: experimental
description: Detects access attempts to GCP metadata IP (169.254.169.254) or Docker socket paths inside sandboxed Linux execution environments.
author: llm-sec-studio
date: 2026-11-19
logsource:
  category: process_creation
  product: linux
detection:
  selection_metadata:
    CommandLine|contains:
      - '169.254.169.254'
      - 'metadata.google.internal'
  selection_dockersock:
    CommandLine|contains:
      - '/var/run/docker.sock'
      - 'docker.sock'
  condition: selection_metadata or selection_dockersock
falsepositives:
  - Authorized host-level monitoring scripts running outside gVisor sandboxes
level: high
tags:
  - attack.credential_access
  - attack.privilege_escalation
  - attack.t1552.005
